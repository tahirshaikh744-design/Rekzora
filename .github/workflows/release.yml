name: Release Rekzora

# Release pipeline (v1.1 — honest and pinned):
#   1. guard: the pushed tag must equal package.json's version
#   2. npm ci (reproducible) → electron runtime binary (install-electron) →
#      unit tests (regression suite)
#   3. headless smoke test (real recording in a real window, honest exit code)
#   4. build NSIS + Portable WITHOUT auto-publish
#   5. SHA-256 checksums file for the exes
#   6. create/upgrade the GitHub Release, attach exes + checksums + notes
#      (tag pushes only — workflow_dispatch runs are build-only)
# All third-party actions are pinned to exact commit SHAs (supply-chain
# hardening); no floating major tags in this file.
# Brand: NEURON TS LABS · Author: Mohd Tahir Shaikh

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout (pinned to actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22 (pinned to actions/setup-node v7.1.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Guard - tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          # pwsh Write-Error does not stop the run by default — every refusal
          # must exit non-zero explicitly so the step fails.
          if ("${{ github.ref_name }}" -notlike 'v*') {
            Write-Host "Refusing: ref '${{ github.ref_name }}' is not a v-version tag (only v-prefixed tags may release)."
            exit 1
          }
          if ($tagVersion -ne $pkgVersion) {
            Write-Host "Refusing: tag v$tagVersion does not match package.json version $pkgVersion. Fix the tag or bump the version."
            exit 1
          }
          Write-Host "Tag/version gate passed: v$tagVersion == $pkgVersion"

      - name: Install dependencies (reproducible)
        run: npm ci --no-audit --no-fund

      - name: Ensure Electron binary is installed
        shell: pwsh
        run: |
          # electron 45+ ships no postinstall hook, so `npm ci` installs only
          # the JS shim and never downloads the runtime binary. install.js is
          # the package's own installer (the install-electron bin); it is
          # idempotent and exits 0 immediately when dist is already present.
          node node_modules\electron\install.js
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Refusing: electron binary install failed with exit $LASTEXITCODE"
            exit 1
          }
          if (-not (Test-Path node_modules\electron\dist\electron.exe)) {
            Write-Host "Refusing: node_modules\electron\dist\electron.exe is still missing after install - cannot run the smoke test or build."
            exit 1
          }
          Write-Host "Electron runtime present: node_modules\electron\dist\electron.exe"

      - name: Unit tests (regression suite)
        run: npm test

      - name: Generate EULA RTF (installer license page)
        run: node scripts/make-license-rtf.cjs

      - name: Headless smoke test (live app, honest exit code)
        shell: cmd
        run: scripts\smoke-run.bat

      - name: Build NSIS + Portable (no auto-publish)
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'FALSE'
        # For a SIGNED build ("verified publisher"), provide these secrets
        # so electron-builder picks them up automatically:
        #   CSC_LINK, CSC_KEY_PASSWORD

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $exes = Get-ChildItem dist -Filter *.exe | Where-Object { $_.Name -notlike '*.blockmap*' }
          if ($exes.Count -lt 2) {
            Write-Error "Refusing: expected Setup + Portable, found $($exes.Count) exe artifacts."
          }
          $lines = foreach ($exe in $exes) {
            $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
            "$hash  $($exe.Name)"
          }
          ($lines -join "`r`n") + "`r`n" | Set-Content -NoNewline -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Create GitHub Release and attach artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = @((Get-ChildItem dist -Filter *.exe | ForEach-Object { $_.FullName }) + 'dist\SHA256SUMS.txt') |
            Where-Object { Test-Path $_ }
          if ($files.Count -lt 2) {
            Write-Error "Refusing: expected Setup + Portable + checksums, found: $($files -join ', ')"
          }
          $tag = "${{ github.ref_name }}"
          # Release title: the H1 heading of RELEASE-NOTES.md; falls back to "Rekzora <tag>".
          $title = "Rekzora $tag"
          if (Test-Path RELEASE-NOTES.md) {
            # Read with explicit UTF-8: the notes H1 carries an emoji and an
            # em-dash; a codepage-dependent reader would mojibake the title.
            $h1 = @([IO.File]::ReadLines("$PWD/RELEASE-NOTES.md", [Text.UTF8Encoding]::new($false)))[0]
            if ($h1 -match '^#\s+(.+)$') { $title = $Matches[1].Trim() }
          }
          Write-Host "Release title: $title"
          $existing = gh release view $tag --json id 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "Release $tag exists — uploading with --clobber"
            gh release upload $tag @files --clobber
            gh release edit $tag --title "$title" $(if (Test-Path RELEASE-NOTES.md) { @("--notes-file", "RELEASE-NOTES.md") })
          } else {
            Write-Host "Creating release $tag"
            if (Test-Path RELEASE-NOTES.md) {
              gh release create $tag @files --title "$title" --notes-file RELEASE-NOTES.md
            } else {
              Write-Warning "RELEASE-NOTES.md is missing — the release will carry generated notes."
              gh release create $tag @files --title "$title" --generate-notes
            }
          }
          if ($LASTEXITCODE -ne 0) { Write-Error "GitHub Release step failed." }
